<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="AMC-Drive project videos">
  <title>AMC-Drive Videos</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #17243a;
      background: #f5f6f8;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .video-page {
      width: min(1100px, 100%);
      padding: clamp(22px, 4vw, 44px);
      border: 1px solid rgba(40, 55, 80, 0.12);
      border-radius: 22px;
      background: #ffffff;
      box-shadow: 0 18px 50px rgba(40, 55, 80, 0.12);
      box-sizing: border-box;
    }
    .back-link {
      color: #2864bd;
      font-weight: 700;
      text-decoration: none;
    }
    h1 {
      margin: 22px 0 8px;
      font-size: clamp(1.55rem, 3vw, 2.35rem);
    }
    .subtitle {
      margin: 0 0 22px;
      color: #66758b;
    }
    .text-summary {
      margin: 0 0 22px;
      padding: 16px 18px;
      border: 1px solid rgba(40, 55, 80, 0.12);
      border-radius: 14px;
      background: #f7f9fc;
      color: #3f4b5b;
      line-height: 1.65;
    }
    .text-summary h2 {
      margin: 0 0 8px;
      color: #17243a;
      font-size: 1.05rem;
    }
    .text-summary p { margin: 0 0 8px; }
    .text-summary p:last-child { margin-bottom: 0; }
    .video-load-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      margin: 0 0 12px;
    }
    .load-video-button {
      padding: 10px 15px;
      border: 0;
      border-radius: 999px;
      background: #2864bd;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .load-video-button:hover,
    .load-video-button:focus-visible { background: #174c99; }
    .video-note {
      margin: 0;
      color: #66758b;
      font-size: 0.88rem;
    }
    video {
      display: block;
      width: 100%;
      max-height: 72vh;
      border-radius: 14px;
      background: #0d1524;
    }
    .language-links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }
    .language-links a {
      padding: 9px 14px;
      border: 1px solid rgba(40, 100, 189, 0.28);
      border-radius: 999px;
      color: #2864bd;
      font-weight: 700;
      text-decoration: none;
    }
    .language-links a:hover,
    .language-links a:focus-visible {
      background: rgba(40, 100, 189, 0.08);
    }
    .fallback {
      margin: 18px 0 0;
      color: #66758b;
      font-size: 0.9rem;
    }
    .fallback a { color: #2864bd; }
  </style>
</head>
<body>
  <main class="video-page">
    <a class="back-link" href="./index.html">← Back to AMC-Drive</a>
    <h1 id="video-title">AMC-Drive Video</h1>
    <p class="subtitle" id="video-subtitle">Select a language to play the project video.</p>
    <section class="text-summary" aria-labelledby="summary-title">
      <h2 id="summary-title">Text summary</h2>
      <p id="video-summary"></p>
      <p id="video-summary-note"></p>
    </section>
    <div class="video-load-row">
      <button class="load-video-button" id="load-video" type="button">Load video</button>
      <p class="video-note">The cover image is shown first; the video file loads only after you request playback.</p>
    </div>
    <video id="project-video" controls playsinline preload="none" poster="./assets/gifs/project_video_poster.jpg">
      <p>Your browser does not support HTML5 video.</p>
    </video>
    <nav class="language-links" aria-label="Video language options">
      <a href="./video.html?lang=zh">中文视频</a>
      <a href="./video.html?lang=en">English video</a>
    </nav>
    <p class="fallback">If playback does not start, <a id="fallback-link" href="">open the video directly</a>.</p>
  </main>
  <script>
    const videos = {
      zh: {
        title: 'AMC-Drive 中文视频',
        subtitle: '中文讲解与项目演示',
        src: './assets/gifs/project_video_zh_web.mp4',
        summary: '本视频介绍 AMC-Drive 如何利用冻结的动作条件预测表征、拓扑感知校准和跨模态防护机制，组织固定预算下的多模态驾驶候选。',
        note: '视频是可选补充材料；页面正文和论文已提供方法与结果概览。'
      },
      en: {
        title: 'AMC-Drive English Video',
        subtitle: 'English project presentation and demonstration',
        src: './assets/gifs/project_video_en_web.mp4',
        summary: 'This presentation explains how AMC-Drive organizes a fixed budget of multimodal driving proposals using frozen action-conditioned predictive representations, topology-aware calibration, and a cross-mode guard.',
        note: 'The video is optional supplementary material; the project page and paper provide the method and results overview.'
      }
    };
    const key = new URLSearchParams(window.location.search).get('lang') === 'zh' ? 'zh' : 'en';
    const video = videos[key];
    document.documentElement.lang = key === 'zh' ? 'zh-CN' : 'en';
    document.title = video.title;
    document.getElementById('video-title').textContent = video.title;
    document.getElementById('video-subtitle').textContent = video.subtitle;
    document.getElementById('video-summary').textContent = video.summary;
    document.getElementById('video-summary-note').textContent = video.note;
    const player = document.getElementById('project-video');
    const loadButton = document.getElementById('load-video');
    loadButton.addEventListener('click', () => {
      if (!player.querySelector('source')) {
        player.insertAdjacentHTML('beforeend', `<source src="${video.src}" type="video/mp4">`);
      }
      loadButton.hidden = true;
      player.load();
      player.play().catch(() => {});
    });
    document.getElementById('fallback-link').href = video.src;
  </script>
</body>
</html>
